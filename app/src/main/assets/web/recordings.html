<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recordings — {{IP}}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: rgba(255,255,255,0.06);
            --text: #e8eaed;
            --text-secondary: #9aa0b0;
            --accent: #00b894;
            --radius: 16px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }
        .container { width: 100%; max-width: 520px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #00b894, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header a { color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 14px; }
        .settings-card {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 8px 20px;
        }
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            gap: 16px;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }
        .setting-row + .setting-row { border-top: 1px solid var(--border); }
        .setting-row:hover .setting-label { color: var(--accent); }
        .setting-label { font-size: 15px; font-weight: 500; }
        .setting-sublabel { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .empty-state { padding: 32px 0; text-align: center; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Recordings</h1>
            <a href="/">&#8592; Dashboard</a>
        </div>
        <div class="settings-card">
            {{ROWS}}
        </div>
    </div>
</body>
</html>
